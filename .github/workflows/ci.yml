name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result: with fail-fast a 3.12 break would
      # cancel the 3.14 job and hide whether the problem is the code or
      # the version floor.
      fail-fast: false
      matrix:
        # 3.12 is the requires-python floor, 3.14 is what the toolkit is
        # developed and used on. Testing only the middle would leave both
        # ends of the contract unchecked.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No `word` extra: pywin32 is Windows-only, and every gate below
        # runs without Word. The 8 tests that drive it are marked and
        # deselected by default.
        #
        # `pdf` IS installed. It is not Windows-only and the tests that
        # need it build their PDFs with pymupdf itself, so all 15 run
        # here — and without it `pages.py` covers 53 % against a floor of
        # 85 %, which is what stopped this workflow the first time ruff
        # let it reach the last step.
        run: pip install -e ".[dev,pdf]"
      # Every gate runs even when an earlier one is red — `!cancelled()`
      # rather than `always()`, so a cancelled run still stops. The job
      # still FAILS on any red step; what changes is that the report is
      # complete. Four days of August were spent with three independent
      # failures stacked behind one ruff error nobody looked past: an
      # unsorted import block hid mypy, which hid a coverage floor, and
      # each only appeared once the one in front of it was fixed.
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        if: ${{ !cancelled() }}
        run: python -m mypy
      - name: Pyright
        if: ${{ !cancelled() }}
        run: python -m pyright
      - name: Pytest
        if: ${{ !cancelled() }}
        run: python -m pytest -q
      - name: Coverage floors
        if: ${{ !cancelled() }}
        run: python tools/coverage_floor.py
