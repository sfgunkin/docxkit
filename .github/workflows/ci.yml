name: CI

on:
  # Not for a push that changes only prose nothing reads. 29 docs-only
  # pushes cost 583 minutes in a month (REVIEW_2026-09-28 §4). Only
  # these two: README.md is gated against the parser, and BACKLOG.md is
  # read by `backlog_status` / `backlog_refs` and their tests, so a push
  # to either still runs everything.
  push:
    branches: [master, main]
    paths-ignore: ["CONTRIBUTING.md", "REVIEW_*.md"]
  pull_request:
    paths-ignore: ["CONTRIBUTING.md", "REVIEW_*.md"]

# A Windows runner's console is cp1252, and every tool here prints
# Cyrillic, em dashes and the glyphs it repairs: `unrun_assertions.py`
# died on its first finding in the first Windows run. The tools guard
# themselves (`console.utf8_stdout`); this covers any that does not.
env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    # Windows, since 2026-09-29: the toolkit is developed and used on
    # Windows only, and never on Linux (the maintainer's call). The Linux
    # runner's red was, more than once, a claim about Linux alone — a
    # coverage floor on lines only pywin32 reaches (09-11), a sweep root
    # split on `:` — and it did not run the Windows-only tests at all
    # (job objects, `taskkill` trees), which now run here.
    runs-on: windows-latest
    strategy:
      matrix:
        # 3.14 only, since 2026-09-12: the one interpreter the toolkit is
        # developed and used on. 3.12 and 3.13 left the matrix together
        # with requires-python's floor, so the package claims no version
        # this job does not run. Kept a matrix so the job is still named
        # `test (3.14)`.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because two gates READ it and both go
          # blind without it. `tools/backlog_refs.py` walks back to the
          # newest commit that closed a backlog entry, and
          # `tools/verify_committed.py` exports a ref. At the default
          # depth of 1 the backlog gate cannot see the commits it judges,
          # so it reports a clean answer over a history it never read —
          # measured against depth-1 clones: at a tip one commit above an
          # unrecorded fix it returned nothing where the full history
          # named it. Worse on a pull request, where checkout resolves
          # `refs/pull/N/merge` and a merge commit lists no files at all.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The `word` extra too, as on the machine the package is used on:
        # pywin32 installs on a Windows runner, and Word itself does not —
        # the 8 tests that drive Word are marked and deselected by default.
        #
        # `pdf` IS installed. It is not Windows-only and the tests that
        # need it build their PDFs with pymupdf itself, so all 15 run
        # here — and without it `pages.py` covers 53 % against a floor of
        # 85 %, which is what stopped this workflow the first time ruff
        # let it reach the last step.
        #
        # `latex` too, since 2026-09-03. `tests/test_equations_typography.py`
        # landed on 08-24 calling `latex_to_omml` in 22 tests with no
        # `importorskip`, and every run from then on was red — twelve in a
        # row unread, the 08-14 lesson four lines up repeated. The tests now
        # skip where the extra is absent; installing it HERE is what keeps
        # them tests rather than skips.
        id: install
        run: pip install -e ".[dev,pdf,latex,word]"
      # Every gate runs even when an earlier GATE is red — `!cancelled()`
      # rather than `always()`, so a cancelled run still stops. The job
      # still FAILS on any red step; what changes is that the report is
      # complete. Four days of August were spent with three independent
      # failures stacked behind one ruff error nobody looked past: an
      # unsorted import block hid mypy, which hid a coverage floor, and
      # each only appeared once the one in front of it was fixed.
      #
      # But not when the INSTALL is red. Without the condition below a
      # failed install skipped ruff (its default is `success()`) and ran
      # the four behind it, each failing with `No module named …`: five
      # red steps, four of them noise, and the one real cause the only
      # one that does not look like a gate failure.
      - name: Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check .
      - name: Mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy
      - name: Pyright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pyright
      # Two seconds, about the source alone: can this `| None` ever BE
      # None. See `tools/gates.py`, where it has run since 2026-09-18.
      - name: Optionals
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/optional_audit.py --callers tests
      # ONE run of the suite, under coverage, as the local chain has done
      # since 2026-09-18: `floors` and `unrun` read the report it writes.
      # CI ran it twice — this step bare (77 s) and then
      # `coverage_floor.py` running the whole suite again under the
      # tracer (73 s) — for the same tests over the same code.
      - name: Pytest
        id: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python -m pytest -q -n auto --durations=25 --durations-min=0.05
          --cov=docxkit --cov=tests --cov-report=json:coverage.json
      # The two readers of that report are gated on PYTEST: on a red
      # suite the report is partial and both would bury the one failure
      # that matters under a wall of their own.
      - name: Coverage floors
        if: ${{ !cancelled() && steps.pytest.outcome == 'success' }}
        run: python tools/coverage_floor.py --from-json coverage.json
      - name: Unrun assertions
        if: ${{ !cancelled() && steps.pytest.outcome == 'success' }}
        run: python tools/unrun_assertions.py --from-json coverage.json
      # A claim in `tools/equivalents.toml` that no longer names its line
      # — what a fix leaves behind when it forgets to delete one.
      - name: Claims
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/verify_equivalents.py --anchors
      # The public surface, against the last release. It needs the whole
      # history — the checkout above already fetches it for the two gates
      # that read commits, and this one checks a TAG out into a worktree —
      # and it needs the `dev` extra, which carries griffe.
      #
      # Only the breakage kinds that break a CALL fail it; a constant
      # whose value changed is reported. That split was measured before
      # this step existed: over fourteen commits griffe reported 21
      # findings, all of them a constant's value and none of them
      # breaking, so the unsplit gate would have been red on half of
      # them. See `tools/api_check.py`.
      #
      # Gated on the INSTALL rather than on pytest: a signature that moved
      # is worth reporting even on a red suite, because it is about a
      # consumer this repository cannot run — the nine papers that import
      # docxkit from an editable install.
      - name: API surface
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/api_check.py
      # Does the SHIPPED package import anything it does not declare?
      # `pyproject.toml` has been wrong about that three times —
      # latex2mathml, pymupdf, pandas — and every time a clean checkout
      # is what found out, days later. This is the gate that asks while
      # the answer is still cheap, and CI is where it matters most: a
      # runner installs `.[dev,pdf]` and nothing else, which is the
      # environment the failure shows up in.
      #
      # Scoped and configured in `[tool.deptry]`, where the reasoning
      # for `src`-only and the DEP002 exclusion is written down.
      - name: Dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m deptry src
