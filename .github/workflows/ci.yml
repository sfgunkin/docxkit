name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result: with fail-fast a 3.12 break would
      # cancel the 3.14 job and hide whether the problem is the code or
      # the version floor.
      fail-fast: false
      matrix:
        # 3.12 is the requires-python floor, 3.14 is what the toolkit is
        # developed and used on. Testing only the middle would leave both
        # ends of the contract unchecked.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because two gates READ it and both go
          # blind without it. `tools/backlog_refs.py` walks back to the
          # newest commit that closed a backlog entry, and
          # `tools/verify_committed.py` exports a ref. At the default
          # depth of 1 the backlog gate cannot see the commits it judges,
          # so it reports a clean answer over a history it never read —
          # measured against depth-1 clones: at a tip one commit above an
          # unrecorded fix it returned nothing where the full history
          # named it. Worse on a pull request, where checkout resolves
          # `refs/pull/N/merge` and a merge commit lists no files at all.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No `word` extra: pywin32 is Windows-only, and every gate below
        # runs without Word. The 8 tests that drive it are marked and
        # deselected by default.
        #
        # `pdf` IS installed. It is not Windows-only and the tests that
        # need it build their PDFs with pymupdf itself, so all 15 run
        # here — and without it `pages.py` covers 53 % against a floor of
        # 85 %, which is what stopped this workflow the first time ruff
        # let it reach the last step.
        id: install
        run: pip install -e ".[dev,pdf]"
      # Every gate runs even when an earlier GATE is red — `!cancelled()`
      # rather than `always()`, so a cancelled run still stops. The job
      # still FAILS on any red step; what changes is that the report is
      # complete. Four days of August were spent with three independent
      # failures stacked behind one ruff error nobody looked past: an
      # unsorted import block hid mypy, which hid a coverage floor, and
      # each only appeared once the one in front of it was fixed.
      #
      # But not when the INSTALL is red. Without the condition below a
      # failed install skipped ruff (its default is `success()`) and ran
      # the four behind it, each failing with `No module named …`: five
      # red steps, four of them noise, and the one real cause the only
      # one that does not look like a gate failure.
      - name: Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check .
      - name: Mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy
      - name: Pyright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pyright
      - name: Pytest
        id: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q
      # The floors are the exception, and gated on PYTEST rather than on
      # the install: `tools/coverage_floor.py` runs the whole suite again
      # in a subprocess to collect coverage, so on a red suite it costs a
      # second full run to report every module under its floor — a wall
      # of failures on top of the one that matters.
      - name: Coverage floors
        if: ${{ !cancelled() && steps.pytest.outcome == 'success' }}
        run: python tools/coverage_floor.py

  mutations:
    # The CURATED mutations. Every one re-introduces a defect this package
    # has really shipped, or removes a guard that exists because one did,
    # and every one of them must turn the suite red.
    #
    # Wired here 2026-08-27, having never been wired to anything. It is in
    # neither this file nor the local gate chain, so its report has been
    # true and unread: three anchors had drifted, it said so and exited 1
    # on every run, and `39/39 mutations caught` at the top of the output
    # is the number an eye lands on. A drifted anchor is a curated defect
    # whose regression cover has silently gone.
    #
    # Its OWN job, not a step in the matrix above: it is 39 runs of the
    # suite, and running that on three interpreters would treble the bill
    # for an answer that does not depend on the version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - id: install
        run: pip install -e ".[dev,pdf]"
      - name: Curated mutations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/mutate.py
