[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docxkit"
version = "1.0.0"
description = "Shared toolkit for working with Word .docx manuscripts: surgical XML editing, multi-layer diffing, tracked-changes deliverables, and author-edit ingestion."
readme = "README.md"
# PEP 639: an SPDX expression, not the {text = ...} table. setuptools has
# deprecated the table form and warns on it from 77 onward.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Lokshin" }]
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
]

[project.urls]
Homepage = "https://github.com/sfgunkin/docxkit"
Repository = "https://github.com/sfgunkin/docxkit"
Issues = "https://github.com/sfgunkin/docxkit/issues"

[project.optional-dependencies]
# Word automation: Windows only, and only needed for the COM-backed features
# (redline via CompareDocuments, PDF export, page counts).
word = ["pywin32>=306"]
# Building NEW math from LaTeX (`equations.latex_to_omml`). Optional for
# the same reason as `word`: it backs one function, which imports it
# lazily. It went undeclared entirely until CI failed on a clean
# checkout — installed on the author's machine, invisible everywhere
# else, and nothing told a user what to install when the ImportError hit.
latex = ["latex2mathml>=3.75"]
# Reading the RENDER (`docxkit pages --check`): the only way to see a
# blank sheet or a numbering restart, neither of which is inferable from
# the XML. Optional for the same reason as `word`, which it needs anyway.
pdf = ["pymupdf>=1.24"]
# `tables.to_frame` only. pandas is heavy and the toolkit reads tables
# perfectly well without it, so it stays out of the core dependency the
# same way — and, like latex2mathml, it was undeclared until a clean
# environment asked for it.
pandas = ["pandas>=2.0"]
# Everything the documented gates need. hypothesis is not optional:
# tests/test_properties.py and test_tables_api.py import it at module
# level, so a clone without it does not lose the property suite quietly
# — it fails at collection. pytest-timeout is here because Word can hang
# (see [tool.pytest.ini_options]).
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyright>=1.1",
       "lxml-stubs>=0.5", "hypothesis>=6.100", "coverage>=7.5",
       "pytest-cov>=5.0", "pytest-timeout>=2.3", "pytest-xdist>=3.6",
       # `tools/api_check.py`, the `api` gate: loads the package from a
       # git ref and from the tree, and reports what a CALLER would
       # notice. Not optional — a missing griffe fails that gate rather
       # than skipping it, which is the right way round.
       "griffe>=1.0",
       # The `deps` gate. It answers the one question this file has been
       # wrong about three times — latex2mathml, pymupdf and pandas each
       # imported before they were declared, each found by CI on a clean
       # checkout after the fact.
       "deptry>=0.20"]

[project.scripts]
docxkit = "docxkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: the package is fully annotated (mypy + pyright green), and
# without this marker a consumer's type checker treats every docxkit
# import as an error AND every docxkit call as Any — so the paper
# scripts got no checking of the API they lean on hardest.
[tool.setuptools.package-data]
docxkit = ["py.typed"]

# What the SHIPPED package imports, against what it declares. Scoped to
# `src` and nothing else, which is the whole of the useful
# configuration: over the full tree deptry reports 41 issues and not one
# is real — 16 are `tools/` siblings imported by bare name after a
# `sys.path.insert`, 17 are `docxkit` itself imported by a tool, and 8
# are the DEP002 below. Neither `tools/` nor `tests/` is distributed, so
# an undeclared import there breaks nobody's install.
#
# DEP002 ("declared but not imported") is off because every dev
# dependency here is either a COMMAND (ruff, mypy, pyright, deptry), a
# pytest PLUGIN loaded by entry point (cov, timeout, xdist), or type
# stubs (lxml-stubs). None is imported by name and none should be.
# Leaving it on makes the gate red for eight reasons that will never be
# fixed, which is the shape people learn to skip past.
#
# What is left is the rule that matters, and it was proved against the
# three failures this file records: with the extra removed from the
# lists above and the import still in the code, deptry exits 1 naming
# `equations.py:411`, `pages.py:96` and `_table_core.py:1000`. It
# reports them as DEP003 rather than DEP001 because the package IS
# installed on the machine running it — which is exactly why those three
# shipped undeclared and only a clean checkout ever noticed.
[tool.deptry]
extend_exclude = ["tools", "tests"]
ignore = ["DEP002"]

# `pywin32` is the DISTRIBUTION; what `word.py` imports is `win32com`
# and `pythoncom`, and deptry learns that mapping from the installed
# package's metadata — which is exactly what a Linux runner does not
# have, the extra being Windows-only. So on CI both imports read as
# "missing from the dependency definitions" (DEP001) and the gate was
# red on every interpreter from the day it was added (2026-09-02) —
# unseen, behind the typography failures. Stated here, the mapping
# holds wherever the extra is absent.
[tool.deptry.package_module_name_map]
pywin32 = ["win32com", "pythoncom"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4", "C90", "PL",
          "FURB", "ISC", "PIE", "RUF"]
ignore = [
    "PLR0912",  # branch count: the XML passes are legitimately branchy
    "PLR0913",  # argument count: keyword-only options read better than dicts
    "PLR0915",  # statement count: ditto for the report renderers
    "PLR2004",  # magic values: OOXML constants are clearer inline
]

# The three PLR ignores above are right — an XML pass IS branchy — but
# with mccabe unselected as well, NOTHING watched size at all, and that
# is how `cli.main` reached 289 lines and `_audit_findings` a complexity
# of 38. A threshold rather than a rule: 20 leaves the branchy passes
# alone and catches the next function that grows past them. The six that
# were already above it were listed under per-file-ignores — the debt
# stated in one place instead of a gate nobody can turn on — and PINNED
# by tests/test_complexity_debt.py, because a per-file ignore cannot say
# "this function only" and started covering NEW code within hours of
# being written. All six are paid now (see the C901 note below), so no
# file carries the exemption and the pin holds the whole package.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# ---- C901: NOTHING is over the threshold, and no file carries the
# exemption any more. `tests/test_complexity_debt.py` walks the package
# with `--isolated`, so with its DEBT list empty it now reads "no
# function in docxkit exceeds 20" rather than "no NEW one does".
#
# The six paid, and what each became. Five took the same shape: the pass
# was one loop per KIND of finding already, so each loop became a
# function and the caller kept the emission order, which is the report
# itself and not an implementation detail.
#   `_cite_build.link_all`        29 -> its mention scan is a method on
#                                       `_Mentions`
#   `lint.lint`                   31 -> eight numbered checks, eight
#                                       functions; nothing in that file
#                                       now reaches 10
#   `_cite_audit._audit_findings` 30 -> `_marker_findings`,
#                                       `_link_findings`,
#                                       `_doubled_findings` and
#                                       `_mention_findings`, the last
#                                       taking the five bindings that
#                                       were only ever its own
#   `refstyle.audit`              25 -> `_ambiguous_findings` and
#                                       `_crosscheck_findings`, beside
#                                       the `_order_/_locator_/_layout_`
#                                       passes already there
#   `revisions._simulate_where`   24 -> `_apply_content` / `_apply_rows`
#                                       / `_apply_marks`, beside the
#                                       `_apply_property_changes` and
#                                       `_apply_cell_changes` already
#                                       there. The CALL ORDER is the
#                                       subject of three comments in
#                                       that function and is unchanged
# The sixth is not a report. `edit.replace_in_para` 24 -> the two things
# it did BEFORE the write are functions now — `_locate_anchor` (find the
# span, or say why it is not addressable) and `_refuse_crossed_note` —
# with `_label_end` lifted out of the closure it was hiding in. What is
# left in the function is the run walk and its three refusals.
# compare.py IS a facade now (see citations.py): `from x import y as y`
# is the PEP 484 signal for a deliberate re-export, and every line of
# its import block is one. It also parses the glyphs Word emits and
# defers the cli import to keep the layering acyclic.
"src/docxkit/compare.py" = ["RUF001", "RUF002", "RUF003", "PLC0415",
                            "PLC0414"]
# The comparison's own layers parse those glyphs too — the masking token
# and the report's typographic characters are the subject, not a typo.
"src/docxkit/_compare_read.py" = ["RUF001", "RUF002", "RUF003"]
"src/docxkit/_compare_diff.py" = ["RUF001", "RUF002", "RUF003"]
"src/docxkit/_compare_render.py" = ["RUF001", "RUF002", "RUF003"]
# Lazy imports are deliberate: pywin32 is an optional extra, so the rest of
# the toolkit must import on any platform.
"src/docxkit/word.py" = ["PLC0415"]
# griffe is imported inside `compare()` on purpose: `tests/test_api_check.py`
# imports this module to test its JUDGEMENT — which baseline it picks and
# which findings break a caller — and that must not need griffe installed
# to collect. The gate itself still fails loudly when griffe is missing.
"tools/api_check.py" = ["PLC0415"]
"src/docxkit/cli.py" = ["PLC0415"]
# The glyph table is *about* look-alike characters; flagging them is noise.
"src/docxkit/_xml.py" = ["RUF001"]
# These modules parse the very glyphs Word emits (typographic minus,
# non-breaking space), and defer heavy/optional imports on purpose:
# pandas, latex2mathml, lxml and pytest must not be needed to import
# the toolkit.
# tables.py is a FACADE over the two halves below, so every line of
# its import block is a deliberate re-export (see citations.py).
"src/docxkit/tables.py" = ["RUF001", "PLC0415", "PLC0414"]
# _table_core parses the glyphs Word emits (typographic minus,
# non-breaking space) and defers pandas; _table_layout IS a table
# of character widths, so every look-alike in it is the subject.
"src/docxkit/_table_core.py" = ["RUF001", "PLC0415"]
"src/docxkit/_table_layout.py" = ["RUF001", "PLC0415"]
# lxml is a hard dep but the parse-gate imports it lazily so package.py
# stays importable in the minimal environments the CLI runs in
"src/docxkit/package.py" = ["PLC0415"]
# citations.py is a FACADE: `from x import y as y` is the PEP 484
# signal for a deliberate re-export, which is exactly what every
# line of its import block is. Without this, `ruff --fix` strips
# the names refstyle and the tests import through it.
"src/docxkit/citations.py" = ["RUF001", "PLC0415", "PLC0414"]
# The citation layers, split out of citations.py. The grammar is
# ABOUT look-alike characters (long s, en dash, curly apostrophe);
# the others defer imports to keep the layering acyclic.
"src/docxkit/_cite_grammar.py" = ["RUF001", "RUF002", "PLC0415"]
"src/docxkit/_cite_repair.py" = ["RUF001", "PLC0415"]
"src/docxkit/_cite_audit.py" = ["RUF001", "PLC0415"]
"src/docxkit/_cite_build.py" = ["RUF001", "PLC0415"]
"src/docxkit/crossrefs.py" = ["RUF001", "RUF002", "PLC0415"]
"src/docxkit/testing.py" = ["RUF001", "PLC0415"]
# equations maps the Unicode math glyphs themselves to LaTeX commands,
# and renumber/hygiene document en dashes and curly quotes by showing
# them; every "ambiguous" character in those files is the subject matter.
"src/docxkit/equations.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
"src/docxkit/renumber.py" = ["RUF001", "RUF002"]
# refstyle's whole subject is the en dash and the curly apostrophe: its
# messages must SHOW the wanted glyph ("pp. 45–48"), not describe it —
# and so must the comment explaining which way a range is written.
"src/docxkit/refstyle.py" = ["RUF001", "RUF002", "RUF003"]
"src/docxkit/wordcount.py" = ["RUF001"]
"src/docxkit/hygiene.py" = ["RUF001", "RUF002"]
"src/docxkit/lint.py" = ["PLC0415"]
"src/docxkit/revisions.py" = ["PLC0415"]
# same lazy lxml: the reject-all gate parses, `package_counts` does not,
# and `import docxkit` must not pay for the parser.
"src/docxkit/tracked.py" = ["PLC0415"]
# pymupdf is an optional extra and `word` is Windows-only: `import
# docxkit` must not need either.
"src/docxkit/pages.py" = ["PLC0415"]
# `revision/_init.py` holds the log.md and paper.toml TEMPLATES it
# writes into a migrating project. Their line length is the generated
# file's business — a markdown table row cannot be wrapped without
# changing what is emitted — and the deferred imports across the
# subpackage keep compare's heavy chain, lxml and datetime off the cost
# of `import docxkit`.
#
# `revision.py` was one 3,118-line module until 2026-08-30 and carried
# both exemptions as one line. Split into `revision/`, E501 belongs to
# the ONE half that holds the templates and PLC0415 to the package: a
# directory-wide E501 would have exempted thirteen files that never
# needed it, which is how an exemption written for one reason becomes
# an exemption for none.
"src/docxkit/revision/_init.py" = ["E501", "PLC0415"]
"src/docxkit/revision/*.py" = ["PLC0415"]
# Tests assert on the very glyphs Word normalizes, reach for private
# helpers deliberately, and import optional deps inside the tests that
# skip without them.
# PLR0917 counts POSITIONAL arguments, and a test function is never
# called positionally: pytest resolves fixtures and parametrize ids by
# NAME. A parametrized test that also takes monkeypatch, tmp_path and
# capsys trips it at four fixtures plus three cases, which says nothing
# about the test.
"tests/*" = ["RUF001", "RUF002", "RUF003", "PLC2701", "PLC0415",
             "ISC003", "ISC004", "PLR0917"]
# tools/ holds developer scripts: the mutation table quotes source
# lines verbatim, so it cannot obey the line length or the
# implicit-concatenation rules without changing what it tests.
"tools/*" = ["E501", "ISC003", "ISC004", "PLW1510", "RUF059"]

[tool.mypy]
files = ["src/docxkit", "tests", "tools"]
python_version = "3.12"
# Stricter than the defaults where it catches real mistakes, but short of
# --strict: the XML passes hand back plain str/dict, and demanding full
# annotations on them would add noise without finding bugs.
check_untyped_defs = true
disallow_any_generics = true
# Enabled for the package below, not for the tests: annotating
# 135 test functions as returning None is not information, and
# their bodies are still checked via check_untyped_defs.
disallow_untyped_defs = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["docxkit.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# No stubs published for any of these (lxml has lxml-stubs, installed via
# the dev extra, so it is typed for real and not listed here).
#
# latex2mathml is here because it is ABSENT, not because it is untyped:
# it backs one function, is imported inside it, and the tests
# importorskip it. This list was written on a machine where it happened
# to be installed, so mypy resolved it and nobody noticed the gap until
# CI ran on a clean checkout and failed on all three Python versions.
#
# `docx.*` came off this list when `testing.load_document` did: that
# helper was the package's LAST touch of python-docx, and the README's
# first non-negotiable is never to save through it. The source now does
# not import it at all.
# pymupdf joined it for the same reason on 2026-08-18, and the same way
# — `pages.py` gained `import pymupdf` on the 15th, CI was already red on
# ruff by then, and mypy on all three versions had been failing on a
# clean checkout unseen ever since.
#
# CI installs `.[dev,pdf,latex]` NOW, so pymupdf and latex2mathml are
# present there; what this entry and the `pyright: ignore` beside it
# answer is the environment that installs `.[dev]` alone, which is every
# contributor who does not want a 20 MB wheel to run the tests. An
# optional extra is absent SOMEWHERE by definition, and both checkers
# have to be told so.
module = ["win32com.*", "pythoncom", "latex2mathml.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.pyright]
# Pinned so the CLI and Pylance in the editor agree with each other.
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Nothing is exempt any more. compare.py was, as a verbatim port from
# C:\Users\Ezhik\tools — "working, well-exercised code carried over
# unchanged", which stopped being true the day it was rewritten to read
# every part of a package. It is now three typed layers behind a facade
# and held to the same rules as everything else.
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# `word` drives a real Word instance: minutes, not milliseconds, and no
# use on a machine without it. Deselected by default so the everyday
# suite stays synthetic and fast; run it with `pytest -m word` before a
# release and after any edit to the width model.
markers = ["word: needs a real Word installation (run with -m word)"]
addopts = ["-m", "not word"]
# Word's save path can hang indefinitely, on any drive — the reason
# extract_flat_opc exists — and `pytest -m word` drives a real Word. A
# release gate that hangs is worse than one that fails, so every test
# gets a ceiling. The synthetic suite runs in ~6s total, so this only
# ever fires on a wedged COM call.
timeout = 300

[tool.coverage.run]
source = ["docxkit"]
branch = true

[tool.coverage.report]
exclude_also = [
    # A library never calls SystemExit; the CLI does, and its `if
    # __name__` tail is the one line no test can reach.
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
