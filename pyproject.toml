[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docxkit"
version = "0.1.0"
description = "Shared toolkit for working with Word .docx manuscripts: surgical XML editing, multi-layer diffing, tracked-changes deliverables, and author-edit ingestion."
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Word automation: Windows only, and only needed for the COM-backed features
# (redline via CompareDocuments, PDF export, page counts).
word = ["pywin32>=306"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyright>=1.1",
       "lxml-stubs>=0.5"]

[project.scripts]
docxkit = "docxkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4", "PL", "FURB",
          "ISC", "PIE", "RUF"]
ignore = [
    "PLR0912",  # branch count: the XML passes are legitimately branchy
    "PLR0913",  # argument count: keyword-only options read better than dicts
    "PLR0915",  # statement count: ditto for the report renderers
    "PLR2004",  # magic values: OOXML constants are clearer inline
]

[tool.ruff.lint.per-file-ignores]
# Verbatim ports of the tools that lived in C:\Users\Ezhik\tools. They are
# working, well-tested code carried over unchanged on purpose; reformatting
# ~2000 lines to a new line-length would risk behaviour for no benefit.
# New code in this package is held to the full ruleset above.
"src/docxkit/compare.py" = ["ALL"]
"src/docxkit/_citation_audit.py" = ["ALL"]
"src/docxkit/word_edits.py" = ["ALL"]
# Lazy imports are deliberate: pywin32 is an optional extra, so the rest of
# the toolkit must import on any platform.
"src/docxkit/word.py" = ["PLC0415"]
"src/docxkit/cli.py" = ["PLC0415"]
# The glyph table is *about* look-alike characters; flagging them is noise.
"src/docxkit/_xml.py" = ["RUF001"]
# These modules parse the very glyphs Word emits (typographic minus,
# non-breaking space), and defer heavy/optional imports on purpose:
# pandas, latex2mathml, lxml and pytest must not be needed to import
# the toolkit.
"src/docxkit/tables.py" = ["RUF001", "PLC0415"]
"src/docxkit/citations.py" = ["RUF001"]
"src/docxkit/testing.py" = ["RUF001", "PLC0415"]
# equations maps the Unicode math glyphs themselves to LaTeX commands,
# and renumber/hygiene document en dashes and curly quotes by showing
# them; every "ambiguous" character in those files is the subject matter.
"src/docxkit/equations.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
"src/docxkit/renumber.py" = ["RUF001", "RUF002"]
"src/docxkit/wordcount.py" = ["RUF001"]
"src/docxkit/hygiene.py" = ["RUF001", "RUF002"]
"src/docxkit/lint.py" = ["PLC0415"]
"src/docxkit/revisions.py" = ["PLC0415"]
# Tests assert on the very glyphs Word normalizes, reach for private
# helpers deliberately, and import optional deps inside the tests that
# skip without them.
"tests/*" = ["RUF001", "RUF002", "RUF003", "PLC2701", "PLC0415"]

[tool.mypy]
files = ["src/docxkit", "tests", "tools"]
python_version = "3.12"
# Stricter than the defaults where it catches real mistakes, but short of
# --strict: the XML passes hand back plain str/dict, and demanding full
# annotations on them would add noise without finding bugs.
check_untyped_defs = true
disallow_any_generics = true
# Enabled for the package below, not for the tests: annotating
# 135 test functions as returning None is not information, and
# their bodies are still checked via check_untyped_defs.
disallow_untyped_defs = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["docxkit.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# No stubs published for any of these (lxml has lxml-stubs, installed via
# the dev extra, so it is typed for real and not listed here).
module = ["win32com.*", "pythoncom", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Verbatim ports from C:\Users\Ezhik\tools, exempted for the same reason
# they are exempted from the lint config: they are working, well-exercised
# code carried over unchanged, and their errors are all python-docx's
# untyped Document() rather than anything actionable here.
module = ["docxkit.compare", "docxkit._citation_audit",
          "docxkit.word_edits"]
ignore_errors = true

[tool.pyright]
# Pinned so the CLI and Pylance in the editor agree with each other.
pythonVersion = "3.12"
typeCheckingMode = "standard"
# The same verbatim ports mypy and ruff exempt (see their sections above):
# working, well-exercised code carried over unchanged on purpose. `ignore`
# rather than `exclude`, so the files still resolve as imports but report
# no diagnostics, matching mypy's ignore_errors.
ignore = [
    "src/docxkit/compare.py",
    "src/docxkit/_citation_audit.py",
    "src/docxkit/word_edits.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
