  { was = "if spec.page_break and head >= 0 and not _starts_a_page(", line = "if spec.page_break and head != 0 and not _starts_a_page(", why = "`head` is `min(entry index) - 1`, and `references` finds no list at all without a heading above it — so the first entry is never paragraph 0 and `head >= 0` holds on every input. That leaves `head == 0`, where the heading IS the document's first paragraph: `_starts_a_page` answers with its first-paragraph reason there, so the branch yields no finding and no edit whether it is entered or not. Every variant of this guard therefore selects the same documents. Written first as a test of the lower bound, which cannot be reached; `kill_check` said so by killing nothing." },
