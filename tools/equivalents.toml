claims = [
  { was = 'if va and va != "baseline":', line = 'if va and va > "baseline":', why = "`va` is the `w:val` of a `w:vertAlign`, resolved through the cascade, and OOXML admits three values there: baseline, superscript and subscript. Both of the latter sort after baseline, so `>` holds exactly where `!=` does. What the claim excludes is a `w:vertAlign` carrying a value the schema does not define and that sorts before baseline; `styles` reads the attribute verbatim, so such a file would tell them apart. An argument from the DOCUMENT." },
  { was = 'out.add(f"{label} {value}" if attr == "val"', line = 'out.add(f"{label} {value}" if attr >= "val"', why = "`attr` is one of the names `_PARA_PROPS` lists: val, left, start, right, end, firstLine, hanging, before, after, line, lineRule. Every one but val begins with a letter before v, so it sorts below val and `>=` holds for val alone. An argument from the CODE." },
  { was = 'out.add(f"{label} {value}" if attr == "val"', line = 'out.add(f"{label} {value}" if attr is "val"', why = "`attr` is the very string object `_PARA_PROPS` holds. Both it and the literal here are identifier-like constants of one module, which CPython interns to one object, so identity answers as equality does. An argument from the CODE." },
  { was = 'body = run.group(1)', line = 'body = run.group( 0)', why = "Group 0 is group 1 with the run's own `<w:r ...>` and `</w:r>` around it, and `RUN_RE`'s `[^>]*` cannot cross a `>`, so that open tag holds no element. The two readers of `body` look for `<w:rPr>` and for `<w:t>`, neither of which a run tag can contain. Measured 2026-09-15 over eight run shapes — plain, styled, hyperlink, attribute-carrying, empty, two-`w:t` and `w:rPrChange` — with and without a styles part: identical formatting per character." },
  { was = 'rpr = rpr_m.group(1) if rpr_m else None', line = 'rpr = rpr_m.group( 0) if rpr_m else None', why = "Group 0 adds only the `<w:rPr>` and `</w:rPr>` around what group 1 holds. Every reader of `rpr` searches inside it for an element — `w:rStyle`, the four toggles, `w:sz`, `w:color`, `w:vertAlign` — and neither of those two tags can match one. Measured over the same eight run shapes: identical." },
  { was = '| _valued(cascade, rpr, pstyle)', line = '^ _valued(cascade, rpr, pstyle)', why = "The two sets cannot share a member, so their union and their symmetric difference are the same set: `_valued` yields strings beginning `size ` or `colour `, while `_resolved_flags` yields the four toggle words or a resolved `w:vertAlign` value, which OOXML restricts to superscript and subscript once baseline is dropped. An argument from the CODE." },
  { was = 'stack.append([tables, 0, 0])', line = 'stack.append([tables, 0, -1])', why = "The cell counter this initialises is reset to 0 by every `w:tr`, so the value is read only for a `w:p` between `<w:tbl>` and its first row. A paragraph in a table is inside a `w:tc`, inside a `w:tr`: what the claim excludes is a document with a paragraph as a direct child of `w:tbl`, which the schema forbids and Word does not write. An argument from the TREE." },
  { was = 'stack.append([tables, 0, 0])', line = 'stack.append([tables, 0, 1])', why = "The initial cell number, which every `w:tr` resets to 0 before a paragraph inside the table can be reached. See the `-1` claim for what the argument excludes. An argument from the TREE." },
  { was = 'elif tag == "tr":', line = 'elif tag >= "tr":', why = "`tag` is one of the four alternatives `STRUCT_TAG_RE` captures, and tbl is taken by the branch above, so only tr, tc and p reach here. Both tc and p sort below tr, so `>=` holds for tr alone. An argument from the CODE." },
  { was = 'elif tag == "tc":', line = 'elif tag >= "tc":', why = "Only tc and p can reach this branch — tbl and tr are taken above — and p sorts below tc, so `>=` holds for tc alone. An argument from the CODE." },
  { was = 'elif tag == "p":', line = 'elif tag <= "p":', why = "The other three tags `STRUCT_TAG_RE` can capture are taken by the branches above, so `tag` is p whenever this line runs and every comparison of p with p is true. An argument from the CODE." },
  { was = 'elif tag == "p":', line = 'elif tag >= "p":', why = "Reached only with `tag` equal to p, the one alternative the branches above do not take, so the ordering test is true exactly when the equality is. An argument from the CODE." },
  { was = 'elif tag == "p":', line = 'elif tag is "p":', why = "Reached only with `tag` equal to p — and p is one character, so the regex hands back the single Latin-1 string object CPython caches, which is the object this literal is too. An argument from the CODE." },
  { was = 'near = [texts[i], *texts[i + 1:i + 3],', line = 'near = [texts[i], *texts[i * 1:i + 3],', why = "The window then begins at `i`, so it gains `texts[i]` — which is already the first item of `near`. The caption is the first non-empty item, and repeating the first item cannot change it. An argument from the CODE." },
  { was = 'near = [texts[i], *texts[i + 1:i + 3],', line = 'near = [texts[i], *texts[i ** 1:i + 3],', why = "`i ** 1` is `i`: the window gains `texts[i]`, already the first item of `near`, and the first non-empty item is unchanged. An argument from the CODE." },
  { was = 'near = [texts[i], *texts[i + 1:i + 3],', line = 'near = [texts[i], *texts[i + 0:i + 3],', why = "The window begins at `i` instead of after it, repeating `texts[i]`, which is already the first item of `near`. An argument from the CODE." },
  { was = 'near = [texts[i], *texts[i + 1:i + 3],', line = 'near = [texts[i], *texts[i // 1:i + 3],', why = "`i // 1` is `i`: the window repeats `texts[i]`, already the first item of `near`, so the first non-empty item is unchanged. An argument from the CODE." },
  { was = 'near = [texts[i], *texts[i + 1:i + 3],', line = 'near = [texts[i], *texts[i | 1:i + 3],', why = "For an even `i` this IS `i + 1`. For an odd one it is `i`, which only repeats `texts[i]`, already the first item of `near`. Either way the first non-empty item is the same. An argument from the CODE." },
  { was = 'labels.setdefault(target, caption[:60])', line = 'labels.setdefault(target, caption[: 59])', kind = "cosmetic", why = "How much of a caption a media finding quotes. Sixty characters is enough to find the figure on the page and short enough to leave the rest of the line readable; one character fewer is the same line to a reader." },
  { was = 'labels.setdefault(target, caption[:60])', line = 'labels.setdefault(target, caption[: 61])', kind = "cosmetic", why = "The quoted width of a figure's caption in a finding, one character wider. See the `[: 59]` claim: nothing downstream measures it." },
  { was = 'self.label = "body" if stem == "document" else stem', line = 'self.label = "body" if stem <= "document" else stem', why = "`stem` is what `TEXT_PART_RE` admits: document, footnotes, endnotes, header<n> and footer<n>. Every one but document begins with a letter after d, so `<=` holds for document alone. An argument from the CODE." },
  { was = 'score = 0.0', line = 'score = -1.0', why = "The only extra candidate a start of -1.0 admits is a part whose similarity to this one is 0.0, and the `score >= 0.6` gate below refuses it — `best` is read only through that gate, so no pair is made either way. Measured 2026-09-15 on a similar pair, an unrelated pair and a blank blob: identical pairings." },
  { was = 'if any(s <= result_at < e for s, e, _ in regions):', line = 'if any(s < result_at < e for s, e, _ in regions):', why = "`s` is another field's `sep.end()` and `result_at` is this field's. The two separators are distinct matches of one `finditer` over one string, and matches never overlap, so their end offsets never coincide: `s == result_at` cannot happen, and `<` holds exactly where `<=` does. An argument from the CODE." },
  { was = 'if any(s <= result_at < e for s, e, _ in regions):', line = 'if any(s <= result_at <= e for s, e, _ in regions):', why = "`e` is a recorded region's `end.start()`. To equal this field's `result_at` the end mark would have to begin exactly where this field's separate mark ends, with nothing between — and `_field_marks` gives such an end to the field whose separate it follows: a separate is taken by the innermost open field, and the next end pops that same field. The adjacent end is therefore this field's own, and its region is not in the list yet, so no recorded `e` equals `result_at`. An argument from the CODE." },
