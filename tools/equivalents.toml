  { was = "matches[head - 1].group(0) if head > 0 else None):", line = "matches[head - 1].group(0) if head != 0 else None):", why = 'Chooses whether there is a paragraph ABOVE the heading to inspect. `head >= 0` on every input (see the guard claims), so `!= 0` and `> 0` agree everywhere `head` can be. Its siblings that change the INDEX — `head % 1`, `head >> 1`, `head ^ 1` — are all killed: they read a different paragraph.' },
  { was = "after = order[j + 1].surname if j + 1 < len(order) else None", line = "after = order[j + 1].surname if j + 1 != len(order) else None", why = "`j` is a position in `order`, so `j + 1` is at most `len(order)` and never above it — the two comparisons select the same entries. Its sibling `is not` is NOT equivalent and is a count comparison of the kind CONTRIBUTING names: below 257 the two ints are one cached object, above it they are merely equal, and the guard stops recognising the end of a 300-entry bibliography." },
