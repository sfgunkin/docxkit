# Mutants argued to be EQUIVALENT — they change the source and cannot
# change behaviour, so no test can kill them and none should be written.
#
# This exists for the same reason the annotation discount does. A
# survivor list is only useful if its entries are questions, and a
# module whose list is padded with mutants that were settled weeks ago
# gets re-triaged from scratch every sweep — which is how a figure ends
# up being quoted at people with a denominator nobody rechecked.
#
# A claim is keyed on the LINE THE MUTATION PRODUCED, exactly as
# `mutation_survivors.became()` renders it (stripped). Keying on the row
# would break the first time the module moved, and these outlive several
# such moves. Two identical lines in one module share a claim; that has
# not come up, and when it does the claim covers both, which is the
# conservative direction only if the argument covers both — so say so in
# `why` when it matters.
#
# Every claim is re-checked by `python tools/verify_equivalents.py`,
# which applies it and expects it to SURVIVE. A claim that starts being
# killed is not a victory: it means the code or the harness moved and
# the argument no longer describes them. Delete it and look again.

