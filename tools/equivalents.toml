  { was = '''if m.group(1) != "Start" or f'w:name="{name}"' not in m.group(0):''', line = '''if m.group(1) < "Start" or f'w:name="{name}"' not in m.group(0):''', why = "`_BOOKMARK_RE` captures `Start` or `End` and nothing else, and `End` sorts below `Start`, so `<` is true for `End` alone — exactly what `!=` says. An argument from the CODE." },
