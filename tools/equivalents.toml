  { was = 'for tbl in (e for e in block if e.tag == W + "tbl"):  # its header repeats', line = 'for tbl in (e for e in block if e.tag is not W + "tbl"):  # its header repeats', why = "The identity test is true of every element, so the body runs for each — and for anything but a `w:tbl` the row list is empty, which the `if not rows: continue` under it returns on before a property is written. The twin of this line in `keep_together` carries the same claim. An argument from the DOCUMENT." },
  { was = 'continue  # no table, so no rule to read back', line = 'break  # no table, so no rule to read back', why = "Reached only for a block holding no `w:tbl`, and `_blocks` returns none: the walk that builds a block gives up on the caption unless the element it stops at IS a table. Neither the `continue` nor the `break` runs. An argument from the CODE." },
  { was = 'return parent.index(block[0]) if parent is not None else 0', line = 'return parent.index(block[ -1]) if parent is not None else 0', why = "Blocks are disjoint contiguous runs of body children, so ordering them by their first, second or last element gives one and the same order. Disjoint: the walk in front of a caption takes no end marker at the front of its marker run, which is the only kind the note walk of the block above can take, and that note walk stops at a caption. Contiguous: `_blocks` reads each block as one slice, and `place` moves it whole, behind an anchor no block owns — every element of a block is owned, so an anchor stands outside them all and the insertion never lands inside another block. An argument from the CODE." },
