  { was = 'while head < i and is_end_marker(kids[head]):', line = 'while head is not i and is_end_marker(kids[head]):', why = "Identity between two ints, which differs from `<` only at `head == i` — and there the element is the caption paragraph, no end marker, so the loop ends whatever the first clause says. (Below 256 CPython's cache makes identity agree with equality anyway; the argument does not rest on it.) An argument from the CODE." },
  { was = 'for tbl in (e for e in block if e.tag == W + "tbl"):  # bind every row', line = 'for tbl in (e for e in block if e.tag is not W + "tbl"):  # bind every row', why = "`W + tbl` builds a fresh string on every call, so the identity test is true of every element and the body runs for each. Only a `w:tbl` holds `w:tr` as its OWN children — the row-level `w:customXml` and `w:sdtContent` that also hold rows stand inside a table, never beside one — so `findall` answers an empty list for a caption, a note, a marker or a wrapper, the row loop does not run, and nothing is written. An argument from the DOCUMENT." },
